services:
  - type: web
    name: shanto-bot-hosting-v3
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health

    disk:
      name: shanto-dashboard-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      - key: RENDER_API_KEY
        sync: false

      - key: DATABASE_PATH
        value: /var/data/shanto.db
