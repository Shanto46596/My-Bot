<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHANTO HOSTING - Login</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#090d18;color:#f5f7ff;
  font-family:Arial,sans-serif;padding:20px
}
.card{
  width:100%;max-width:390px;background:#141c2d;
  border:1px solid #26334b;border-radius:20px;padding:28px
}
h1{font-size:25px;margin:0 0 8px}
p{color:#9eabc2;font-size:14px;line-height:1.6}
label{display:block;margin:18px 0 7px;color:#cbd5e1}
input{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid #334155;background:#0b1220;
  color:white;font-size:15px
}
button{
  width:100%;padding:14px;margin-top:22px;
  background:#2563eb;color:white;border:0;
  border-radius:10px;font-weight:bold;font-size:15px
}
.error{color:#fca5a5;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>SHANTO BOT HOSTING V3</h1>
  <p>Private Hosting Dashboard</p>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Admin Username</label>
    <input name="username" required autocomplete="username">

    <label>Password</label>
    <input name="password" type="password" required
           autocomplete="current-password">

    <button type="submit">Login to Dashboard</button>
  </form>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="error">{{ message }}</p>
    {% endfor %}
  {% endwith %}
</div>
</body>
    </html>
